<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trình xem Markdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef2ec; --bg2:#dfe8e2; --panel:#ffffff; --panel-a:rgba(255,255,255,.88);
  --ink:#1d2421; --muted:#667069; --line:#d3d9d2; --accent:#1f6f5c; --accent-ink:#fff;
  --code-bg:#eceee8; --quote:#c5ccc2; --star:31,111,92; --danger:#b3392f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#080d1a; --bg2:#14211f; --panel:#18211f; --panel-a:rgba(16,24,26,.84);
    --ink:#e4e9e5; --muted:#92a097; --line:#2c3935; --accent:#6cc4a8; --accent-ink:#0f1a16;
    --code-bg:#222c29; --quote:#3a4741; --star:255,255,255; --danger:#ff8a7e;
  }
}
:root[data-theme="dark"]{
  --bg1:#080d1a; --bg2:#14211f; --panel:#18211f; --panel-a:rgba(16,24,26,.84);
  --ink:#e4e9e5; --muted:#92a097; --line:#2c3935; --accent:#6cc4a8; --accent-ink:#0f1a16;
  --code-bg:#222c29; --quote:#3a4741; --star:255,255,255; --danger:#ff8a7e;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; color:var(--ink); background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;
  font-family:"Literata",Georgia,"Times New Roman",serif; line-height:1.7}
#sky{position:fixed; left:0; top:0; width:100%; height:100%; z-index:0; pointer-events:none}
.bar,main{position:relative; z-index:1}
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
  padding:.6rem 1rem; background:var(--panel-a); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.92rem}
.bar .name{flex:1 1 8rem; min-width:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
button,.btn{font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:.4rem .85rem; border-radius:6px; cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main{max-width:48rem; margin:0 auto; padding:1.5rem 1rem 4rem}
.sheet{background:var(--panel-a); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  border:1px solid var(--line); border-radius:12px; padding:2rem 1.5rem}
#drop{border:2px dashed var(--line); border-radius:10px; padding:2.5rem 1.25rem; text-align:center;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#drop.over{border-color:var(--accent)}
#drop h1{font-size:1.35rem; margin:0 0 .4rem}
#drop p{margin:.3rem 0 1.2rem; color:var(--muted)}
#paste{display:none; margin-top:1rem; width:100%; min-height:10rem; padding:.75rem; border:1px solid var(--line);
  border-radius:6px; background:var(--panel); color:var(--ink); font:.9rem/1.5 "JetBrains Mono",monospace}
#doc,#src{display:none}
#doc h1,#doc h2,#doc h3,#doc h4{line-height:1.3; margin:2rem 0 .7rem}
#doc h1{font-size:2rem; margin-top:0; padding-bottom:.4rem; border-bottom:1px solid var(--line)}
#doc h2{font-size:1.5rem} #doc h3{font-size:1.2rem} #doc h4{font-size:1.05rem}
#doc p,#doc ul,#doc ol,#doc pre,#doc blockquote{margin:0 0 1.1rem}
#doc a{color:var(--accent)} #doc img{max-width:100%; height:auto}
#doc code{font-family:"JetBrains Mono",monospace; font-size:.86em; background:var(--code-bg); padding:.12em .35em; border-radius:4px}
#doc pre{background:var(--code-bg); padding:1rem; border-radius:8px; overflow-x:auto}
#doc pre code{background:none; padding:0}
#doc blockquote{border-left:4px solid var(--quote); padding:.1rem 1rem; color:var(--muted)}
#doc hr{border:0; border-top:1px solid var(--line); margin:2rem 0}
.scroll{overflow-x:auto; margin-bottom:1.1rem}
#doc table{border-collapse:collapse; min-width:100%; font-size:.95rem; margin:0}
#doc th,#doc td{border:1px solid var(--line); padding:.45rem .7rem; text-align:left}
#doc th{background:var(--code-bg)}
#doc li>input[type=checkbox]{margin-right:.4rem}
#src{white-space:pre-wrap; word-break:break-word; font:.88rem/1.6 "JetBrains Mono",monospace; margin:0}
/* chú thích */
mark.a{color:inherit; border-radius:3px; padding:.05em 0; cursor:pointer}
mark[data-c="y"]{background:rgba(255,206,60,.5)} mark[data-c="g"]{background:rgba(88,200,120,.45)}
mark[data-c="b"]{background:rgba(90,160,255,.42)} mark[data-c="p"]{background:rgba(255,120,170,.42)}
span.ul{text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:4px; cursor:pointer}
#tb{position:fixed; z-index:30; display:none; gap:.35rem; align-items:center; padding:.35rem .5rem; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.28); font-family:system-ui,sans-serif}
#tb button{padding:.25rem .5rem; line-height:1}
#tb .dot{width:1.5rem; height:1.5rem; padding:0; border-radius:50%}
#tb .dot[data-c="y"]{background:#ffce3c} #tb .dot[data-c="g"]{background:#58c878}
#tb .dot[data-c="b"]{background:#5aa0ff} #tb .dot[data-c="p"]{background:#ff78aa}
#tb .u{text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; font-weight:700}
#tb .rm{color:var(--danger)}
/* thư viện */
#scrim{position:fixed; inset:0; z-index:15; background:rgba(0,0,0,.45); display:none}
#lib{position:fixed; z-index:20; top:0; bottom:0; left:0; width:min(21rem,88vw); background:var(--panel); border-right:1px solid var(--line);
  transform:translateX(-102%); transition:transform .22s ease; display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + .9rem) .9rem calc(env(safe-area-inset-bottom,0px) + .9rem);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#lib.open{transform:none} #lib h2{margin:0 0 .2rem; font-size:1.1rem}
#lib .hint{margin:0 0 .8rem; font-size:.82rem; color:var(--muted)}
#list{flex:1; overflow-y:auto; margin:0; padding:0; list-style:none}
#list li{display:flex; gap:.4rem; align-items:stretch; margin-bottom:.45rem}
#list .it{flex:1; min-width:0; text-align:left; padding:.55rem .7rem}
#list .it.cur{border-color:var(--accent)}
#list .t{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#list .m{display:block; font-size:.78rem; color:var(--muted)}
#list .del{color:var(--danger)}
.empty{color:var(--muted); font-size:.9rem; padding:.5rem 0}
#lib .tools{display:flex; gap:.4rem; margin-bottom:.7rem}
#lib input,#lib select{font:inherit; font-size:.9rem; padding:.4rem .55rem; border:1px solid var(--line); border-radius:6px; background:var(--bg1); color:var(--ink); min-width:0}
#lib input{flex:1}
#list li.grp{display:block; margin:.8rem 0 .35rem; font-size:.78rem; font-weight:600; color:var(--muted)}
#list li.grp:first-child{margin-top:0}
#list .s{display:block; margin-top:.25rem; font-size:.78rem; color:var(--muted); font-weight:400; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
#list .s b{color:var(--accent); background:rgba(255,206,60,.28); font-weight:600}
@media (max-width:520px){.sheet{padding:1.25rem 1rem}}
@media print{.bar,#sky,#lib,#scrim,#tb{display:none} body{background:#fff; color:#000} .sheet{border:0; background:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="bar">
  <button id="libBtn" aria-expanded="false">Thư viện</button>
  <span class="name" id="name">Chưa mở tệp nào</span>
  <button id="view" aria-pressed="false" hidden>Xem mã nguồn</button>
  <button id="theme">Đổi giao diện</button>
  <label class="btn primary" for="file">Mở tệp .md</label>
  <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
</div>
<div id="scrim"></div>
<aside id="lib" aria-label="Thư viện tệp">
  <h2>Thư viện</h2>
  <p class="hint">Tệp bạn mở được lưu trong trình duyệt này, kèm các chú thích.</p>
  <div class="tools">
    <input id="q" type="search" placeholder="Tìm theo tên hoặc nội dung" aria-label="Tìm tệp" autocomplete="off">
    <select id="sort" aria-label="Sắp xếp"><option value="opened">Mới mở</option><option value="added">Mới thêm</option><option value="name">Tên A–Z</option></select>
  </div>
  <ul id="list"></ul>
  <button id="closeLib">Đóng</button>
</aside>
<div id="tb" role="toolbar" aria-label="Công cụ chú thích"></div>
<main>
  <div class="sheet">
    <section id="drop">
      <h1>Xem tệp Markdown</h1>
      <p>Kéo tệp .md vào đây hoặc chọn từ máy. Tệp được đọc và lưu ngay trên trình duyệt, không tải lên đâu cả. Bôi đen chữ để highlight hoặc gạch chân.</p>
      <button class="primary" id="pick">Chọn tệp</button>
      <button id="pasteBtn">Dán nội dung</button>
      <textarea id="paste" placeholder="Dán Markdown vào đây" aria-label="Dán Markdown"></textarea>
    </section>
    <article id="doc"></article>
    <pre id="src"></pre>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var drop=$('drop'),doc=$('doc'),src=$('src'),view=$('view'),paste=$('paste'),tb=$('tb'),list=$('list');
  var showSource=false,cur=null,baseHTML='',pend=null,editId=null,records=[];

  /* ---------- IndexedDB ---------- */
  var dbp=new Promise(function(res,rej){
    try{var q=indexedDB.open('mdviewer',1);
      q.onupgradeneeded=function(){q.result.createObjectStore('files',{keyPath:'id'})};
      q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};
    }catch(e){rej(e)}
  });
  function tx(mode,fn){return dbp.then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('files',mode),r=fn(t.objectStore('files'));
    t.oncomplete=function(){res(r&&r.result)};t.onerror=function(){rej(t.error)};
  })})}
  function save(){if(!cur)return;
    var i=records.findIndex(function(r){return r.id===cur.id});
    if(i<0)records.unshift(cur);
    tx('readwrite',function(s){return s.put(cur)}).catch(function(){}); drawList();}
  function loadAll(){return tx('readonly',function(s){return s.getAll()}).then(function(a){
    records=(a||[]).sort(function(x,y){return y.opened-x.opened});drawList();}).catch(function(){})}

  /* ---------- Hiển thị tài liệu ---------- */
  function open(rec){
    cur=rec; rec.opened=Date.now();
    baseHTML=DOMPurify.sanitize(marked.parse(rec.text,{gfm:true,breaks:false}));
    src.textContent=rec.text;
    $('name').textContent=rec.name;
    document.title=rec.name+' – Trình xem Markdown';
    drop.style.display='none'; view.hidden=false; setMode(false);
    paint(); hideTb(); closeLib(); window.scrollTo(0,0); save();
  }
  function paint(){
    doc.innerHTML=baseHTML;
    doc.querySelectorAll('table').forEach(function(t){
      var w=document.createElement('div');w.className='scroll';t.parentNode.insertBefore(w,t);w.appendChild(t);});
    doc.querySelectorAll('a[href^="http"]').forEach(function(a){a.target='_blank';a.rel='noopener noreferrer'});
    cur.anns.forEach(wrap);
  }
  function setMode(s){
    showSource=s; doc.style.display=s?'none':'block'; src.style.display=s?'block':'none';
    view.textContent=s?'Xem bản dựng':'Xem mã nguồn'; view.setAttribute('aria-pressed',String(s)); hideTb();
  }
  function newRec(name,text,id){return {id:id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name:name,text:text,added:Date.now(),opened:Date.now(),anns:[]}}
  function addFile(f){return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){
      var text=String(r.result);
      var same=records.find(function(x){return x.name===f.name&&x.text===text});
      var old=records.find(function(x){return x.name===f.name});
      if(same)return res(same);
      var rec=newRec(f.name,text); if(old){rec.id=old.id;rec.added=old.added;} // cùng tên: cập nhật nội dung
      res(rec);
    };
    r.onerror=function(){alert('Không đọc được tệp "'+f.name+'". Hãy thử lại.');res(null)};
    r.readAsText(f,'utf-8');
  })}
  function openFiles(files){
    var p=Promise.resolve(null);
    Array.prototype.forEach.call(files,function(f){p=p.then(function(){return addFile(f)}).then(function(rec){
      if(rec){var i=records.findIndex(function(x){return x.id===rec.id});if(i>=0)records.splice(i,1);records.unshift(rec);cur=rec;
        tx('readwrite',function(s){return s.put(rec)}).catch(function(){});return rec}return null})});
    p.then(function(last){if(last)open(last)});
  }

  /* ---------- Chú thích (highlight / gạch chân) ---------- */
  function offsetOf(node,off){var r=document.createRange();r.setStart(doc,0);r.setEnd(node,off);return r.toString().length}
  function wrap(a){
    var w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT),n,pos=0,parts=[];
    while((n=w.nextNode())){var l=n.nodeValue.length;
      if(pos<a.e&&pos+l>a.s)parts.push([n,Math.max(a.s-pos,0),Math.min(a.e-pos,l)]);pos+=l;}
    parts.forEach(function(p){
      var n=p[0],s=p[1],e=p[2]; if(!n.nodeValue.slice(s,e).trim())return;
      var mid=n.splitText(s); mid.splitText(e-s);
      var el=document.createElement(a.t==='hl'?'mark':'span');
      el.className='a '+(a.t==='hl'?'hl':'ul'); el.dataset.id=a.id; if(a.t==='hl')el.dataset.c=a.c;
      mid.parentNode.insertBefore(el,mid); el.appendChild(mid);
    });
  }
  function showTb(rect,mode){
    tb.innerHTML='';
    function b(cls,txt,label,fn){var x=document.createElement('button');x.className=cls;x.textContent=txt;x.setAttribute('aria-label',label);
      x.addEventListener('mousedown',function(e){e.preventDefault()});x.addEventListener('click',fn);tb.appendChild(x);return x}
    if(mode==='add'){
      [['y','Vàng'],['g','Xanh lá'],['b','Xanh dương'],['p','Hồng']].forEach(function(c){
        var d=b('dot','','Highlight '+c[1],function(){addAnn('hl',c[0])});d.dataset.c=c[0];});
      b('u','U','Gạch chân',function(){addAnn('ul')});
    }else b('rm','Xóa chú thích','Xóa chú thích',removeAnn);
    tb.style.display='flex';
    var w=tb.offsetWidth,h=tb.offsetHeight,top=rect.top-h-8; if(top<60)top=rect.bottom+8;
    tb.style.top=top+'px'; tb.style.left=Math.max(8,Math.min(innerWidth-w-8,rect.left+rect.width/2-w/2))+'px';
  }
  function hideTb(){tb.style.display='none';pend=null;editId=null}
  function addAnn(t,c){
    if(!pend)return;
    cur.anns.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),s:pend.s,e:pend.e,t:t,c:c});
    getSelection().removeAllRanges(); hideTb(); paint(); save();
  }
  function removeAnn(){
    if(!editId)return; cur.anns=cur.anns.filter(function(a){return a.id!==editId});
    hideTb(); paint(); save();
  }
  var selT;
  document.addEventListener('selectionchange',function(){
    clearTimeout(selT);
    selT=setTimeout(function(){
      var sel=getSelection();
      if(!cur||showSource||!sel.rangeCount||sel.isCollapsed){if(pend)hideTb();return}
      var r=sel.getRangeAt(0);
      if(!doc.contains(r.commonAncestorContainer))return;
      var s=offsetOf(r.startContainer,r.startOffset),e=offsetOf(r.endContainer,r.endOffset);
      if(e<=s)return;
      pend={s:s,e:e}; editId=null; showTb(r.getBoundingClientRect(),'add');
    },180);
  });
  doc.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('[data-id]'),sel=getSelection();
    if(el&&sel.isCollapsed){editId=el.dataset.id;pend=null;showTb(el.getBoundingClientRect(),'edit')}
    else if(editId&&!el)hideTb();
  });
  document.addEventListener('click',function(e){if(editId&&!tb.contains(e.target)&&!(e.target.closest&&e.target.closest('[data-id]')))hideTb()});
  window.addEventListener('scroll',function(){if(editId)hideTb()},{passive:true});

  /* ---------- Thư viện ---------- */
  function fmtDate(t){try{return new Date(t).toLocaleDateString('vi-VN')}catch(e){return ''}}
  function dayLabel(t){
    var d=new Date(t),n=new Date();d.setHours(0,0,0,0);n.setHours(0,0,0,0);
    var diff=Math.round((n-d)/864e5);
    if(diff<=0)return 'Hôm nay'; if(diff===1)return 'Hôm qua'; if(diff<=7)return '7 ngày qua'; if(diff<=30)return '30 ngày qua';
    return 'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear();
  }
  function fold(s){ // bỏ dấu, hạ chữ thường, giữ nguyên độ dài
    s=s.normalize('NFC');var o='',i,c;
    for(i=0;i<s.length;i++){c=s.charAt(i);o+=(c==='đ'||c==='Đ')?'d':c.normalize('NFD').charAt(0).toLowerCase()}
    return o;
  }
  var fc=new WeakMap(),query='',sortBy='opened';
  try{var sv=localStorage.getItem('md-sort');if(sv)sortBy=sv}catch(e){}
  function folded(r){var c=fc.get(r);
    if(!c||c.t!==r.text){c={t:r.text,n:fold(r.name),f:fold(r.text),raw:r.text.normalize('NFC')};fc.set(r,c)}return c}
  function drawList(){
    list.innerHTML='';
    var terms=fold(query.trim()).split(/\s+/).filter(Boolean);
    var rows=[];
    records.forEach(function(r){
      var c=folded(r),hit=null;
      if(terms.length){
        var all=c.n+' '+c.f;
        if(!terms.every(function(t){return all.indexOf(t)>=0}))return;
        var j=c.f.indexOf(terms[0]);
        if(j>=0)hit={a:c.raw.slice(Math.max(0,j-28),j).replace(/\s+/g,' '),m:c.raw.substr(j,terms[0].length),
          b:c.raw.slice(j+terms[0].length,j+terms[0].length+60).replace(/\s+/g,' '),pre:j>28};
      }
      rows.push({r:r,hit:hit});
    });
    if(sortBy==='name')rows.sort(function(x,y){return x.r.name.localeCompare(y.r.name,'vi')});
    else rows.sort(function(x,y){return y.r[sortBy]-x.r[sortBy]});
    if(!rows.length){var p=document.createElement('li');p.className='empty';
      p.textContent=records.length?'Không có tệp nào khớp "'+query.trim()+'".':'Chưa có tệp nào. Mở một tệp .md để lưu vào đây.';
      list.appendChild(p);return}
    var lastG=null;
    rows.forEach(function(row){
      var r=row.r;
      if(sortBy!=='name'){var g=dayLabel(r[sortBy]);
        if(g!==lastG){lastG=g;var h=document.createElement('li');h.className='grp';h.textContent=g;list.appendChild(h)}}
      var li=document.createElement('li'),b=document.createElement('button'),d=document.createElement('button');
      b.className='it'+(cur&&cur.id===r.id?' cur':'');
      var t=document.createElement('span'),m=document.createElement('span');t.className='t';m.className='m';
      t.textContent=r.name;
      m.textContent=Math.max(1,Math.round(r.text.length/1024))+' KB · '+r.anns.length+' chú thích · '+fmtDate(r[sortBy==='added'?'added':'opened']);
      b.appendChild(t);b.appendChild(m);
      if(row.hit){var s=document.createElement('span'),k=document.createElement('b'),h=row.hit;
        s.className='s';k.textContent=h.m;
        s.appendChild(document.createTextNode((h.pre?'…':'')+h.a));s.appendChild(k);s.appendChild(document.createTextNode(h.b+'…'));b.appendChild(s)}
      b.addEventListener('click',function(){open(r)});
      d.className='del';d.textContent='Xóa';d.setAttribute('aria-label','Xóa '+r.name);
      d.addEventListener('click',function(){
        if(!confirm('Xóa "'+r.name+'" khỏi thư viện? Các chú thích cũng sẽ mất.'))return;
        records=records.filter(function(x){return x.id!==r.id});
        tx('readwrite',function(s){return s.delete(r.id)}).catch(function(){});
        if(cur&&cur.id===r.id){cur=null;doc.style.display=src.style.display='none';view.hidden=true;drop.style.display='';$('name').textContent='Chưa mở tệp nào';}
        drawList();
      });
      li.appendChild(b);li.appendChild(d);list.appendChild(li);
    });
  }
  $('q').addEventListener('input',function(e){query=e.target.value;drawList()});
  $('sort').value=sortBy;
  $('sort').addEventListener('change',function(e){sortBy=e.target.value;try{localStorage.setItem('md-sort',sortBy)}catch(x){}drawList()});
  function openLib(){$('lib').classList.add('open');$('scrim').style.display='block';$('libBtn').setAttribute('aria-expanded','true')}
  function closeLib(){$('lib').classList.remove('open');$('scrim').style.display='none';$('libBtn').setAttribute('aria-expanded','false')}
  $('libBtn').addEventListener('click',openLib);$('closeLib').addEventListener('click',closeLib);$('scrim').addEventListener('click',closeLib);

  /* ---------- Nhập tệp ---------- */
  $('file').addEventListener('change',function(e){if(e.target.files.length)openFiles(e.target.files);e.target.value=''});
  $('pick').addEventListener('click',function(){$('file').click()});
  view.addEventListener('click',function(){setMode(!showSource)});
  $('pasteBtn').addEventListener('click',function(){paste.style.display='block';paste.focus()});
  var pt;
  paste.addEventListener('input',function(){
    clearTimeout(pt);
    pt=setTimeout(function(){
      var text=paste.value; if(!text.trim())return;
      var old=records.find(function(x){return x.id==='paste'});
      var rec=old||newRec('Nội dung đã dán',text,'paste');
      if(old&&old.text!==text){rec.anns=[]} rec.text=text; open(rec);
    },500);
  });
  ['dragenter','dragover'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
  window.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)openFiles(e.dataTransfer.files)});

  /* ---------- Giao diện ---------- */
  $('theme').addEventListener('click',function(){
    var root=document.documentElement,c=root.getAttribute('data-theme');
    if(!c)c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    var n=c==='dark'?'light':'dark'; root.setAttribute('data-theme',n);
    try{localStorage.setItem('md-theme',n)}catch(e){} readStar();
  });
  try{var s=localStorage.getItem('md-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}

  /* ---------- Nền sao động ---------- */
  var cv=$('sky'),cx=cv.getContext('2d'),W=0,H=0,stars=[],shoot=null,starRGB='255,255,255',nextShoot=0;
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function readStar(){starRGB=getComputedStyle(document.documentElement).getPropertyValue('--star').trim()||'255,255,255';if(still)frame(0)}
  function size(){
    var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    var n=Math.min(260,Math.round(W*H/5500));stars=[];
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.25,p:Math.random()*6.28,s:Math.random()*1.6+.5,v:Math.random()*.12+.02});
    if(still)frame(0);
  }
  function frame(t){
    cx.clearRect(0,0,W,H);
    var light=starRGB!=='255,255,255',k=light?.5:1;
    for(var i=0;i<stars.length;i++){var s=stars[i];
      if(!still){s.y-=s.v;s.x+=s.v*.35;if(s.y<-2){s.y=H+2;s.x=Math.random()*W}if(s.x>W+2)s.x=-2}
      var a=(.3+.7*(Math.sin(t*.001*s.s+s.p)+1)/2)*k;
      cx.fillStyle='rgba('+starRGB+','+a.toFixed(3)+')';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();
      if(s.r>1.15){cx.fillStyle='rgba('+starRGB+','+(a*.12).toFixed(3)+')';cx.beginPath();cx.arc(s.x,s.y,s.r*3.2,0,6.283);cx.fill()}
    }
    if(!still){
      if(!shoot&&t>nextShoot){shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.35,vx:-7-Math.random()*4,vy:3+Math.random()*2,life:1};nextShoot=t+5000+Math.random()*9000}
      if(shoot){var g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);
        g.addColorStop(0,'rgba('+starRGB+','+(.9*shoot.life*k)+')');g.addColorStop(1,'rgba('+starRGB+',0)');
        cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);cx.stroke();
        shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.014;if(shoot.life<=0)shoot=null}
      requestAnimationFrame(frame);
    }
  }
  addEventListener('resize',size);size();readStar();if(!still)requestAnimationFrame(frame);
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readStar);

  loadAll();
})();
</script>
